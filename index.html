    <script>
        // 簡易防護：禁止右鍵與F12
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) { return false; } // F12
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)){ return false; } // Ctrl+Shift+I
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)){ return false; } // Ctrl+Shift+C

        }

            // 預覽編輯器 State
            const [previewText, setPreviewText] = useState('');
            
            // 快速編輯模式狀態
            const [isEditingRates, setIsEditingRates] = useState(false);

            // 初始化與 LocalStorage (智能縫合邏輯)
            useEffect(() => {
                const savedData = localStorage.getItem('mortgageBankData_PRO');
                if (savedData) {
                    try {
                        const parsedData = JSON.parse(savedData);
                        
                        // 1. 處理估價銀行的縫合 (保留使用者自訂銀行，覆蓋預設八家銀行)
                        let mergedAppraisalBanks = [];
                        if (parsedData.appraisalBanks) {
                            const initialNames = INITIAL_DATA.appraisalBanks.map(b => b.name);
                            const userAddedBanks = parsedData.appraisalBanks.filter(b => !initialNames.includes(b.name));
                            mergedAppraisalBanks = [...INITIAL_DATA.appraisalBanks, ...userAddedBanks];
                        } else {
                            mergedAppraisalBanks = INITIAL_DATA.appraisalBanks;
                        }
                        parsedData.appraisalBanks = mergedAppraisalBanks;
                        
                        // 2. 處理其它被誤刪的陣列 (確保新版也有完整結構)
                        if (!parsedData.firstTime) parsedData.firstTime = INITIAL_DATA.firstTime;
                        if (!parsedData.selfEmployed) parsedData.selfEmployed = INITIAL_DATA.selfEmployed;
                        if (!parsedData.guarantor) parsedData.guarantor = INITIAL_DATA.guarantor;
                        if (!parsedData.storefront) parsedData.storefront = INITIAL_DATA.storefront;
                        if (!parsedData.combo) parsedData.combo = INITIAL_DATA.combo;
                        if (!parsedData.cashRefinance) parsedData.cashRefinance = INITIAL_DATA.cashRefinance;
                        if (!parsedData.renovation) parsedData.renovation = INITIAL_DATA.renovation;
                        if (!parsedData.noTieIn) parsedData.noTieIn = INITIAL_DATA.noTieIn;

                        setBankData(parsedData);
                    } catch(e) {
                        console.error("解析存檔失敗", e);
                    }
                }
            }, []);

            // 每次表單或選擇的銀行改變時，自動重新生成預覽文字
            useEffect(() => {
                let text = `${appraisalForm.dateId}${appraisalForm.projectName}*${appraisalForm.clientName}\n\n`;
                text += `📍標的位置：${appraisalForm.address}\n\n`;
                text += `💰${appraisalForm.priceType}： ${appraisalForm.price}\n\n`;

                let counter = 1;
                bankData.appraisalBanks.forEach(bankInfo => {
                    if (appraisalForm.selectedBanks.includes(bankInfo.name)) {
                        text += `${counter}、${bankInfo.name}：\n${bankInfo.rate}\n\n`;
                        counter++;
                    }
                });

                text += `✨以上為銀行初估額度，並非最終額度。\n`;
                text += `客戶條件、收支比、地緣性、實價登錄價格及成交金額會影響預估金額，要等正式送件方可確認。如有問題洽  \n`;
                text += `☀️宏國地政｜易丞地政\n`;
                text += `☎️06-258-2589`;

                setPreviewText(text);
            }, [appraisalForm, bankData.appraisalBanks]);

            // 儲存資料到 LocalStorage
            const handleSaveData = () => {
                localStorage.setItem('mortgageBankData_PRO', JSON.stringify(bankData));
                alert('資料庫已更新！');
            };

            const handleResetData = () => {
                if(window.confirm('確定要重置回預設資料嗎？此動作將清除您自訂新增的銀行。')) {
                    setBankData(INITIAL_DATA);
                    localStorage.removeItem('mortgageBankData_PRO');
                }
            };

            // --- 估價回覆產生器邏輯 ---
            const handleParseAppraisalText = () => {
                if (!appraisalRawText.trim()) return;
                let newForm = { ...appraisalForm };
                const text = appraisalRawText;
                
                const extractName = text.match(/(?:客戶姓名|名稱|姓名)[\*：:\s]+([^\n]*)/);
                if (extractName) newForm.clientName = extractName[1].trim();

                const extractAddress = text.match(/(?:標的位置|標的資訊|地址|位置)[\*：:\s]+([^\n]*)/);
                if (extractAddress) newForm.address = extractAddress[1].trim();

                if (text.includes('成交價')) newForm.priceType = '成交價';
                else newForm.priceType = '開價';

                const extractPrice = text.match(/(?:預計成交\/開價|開價|預計成交|成交價|金額)[\*：:\s]+([^\n]*)/);
                if (extractPrice) newForm.price = extractPrice[1].trim();

                setAppraisalForm(newForm);
            };

            const toggleAppraisalBank = (bankName) => {
                setAppraisalForm(prev => {
                    const isSelected = prev.selectedBanks.includes(bankName);
                    if (isSelected) {
                        return { ...prev, selectedBanks: prev.selectedBanks.filter(b => b !== bankName) };
                    } else {
                        return { ...prev, selectedBanks: [...prev.selectedBanks, bankName] };
                    }
                });
            };

            // 快速編輯模式邏輯 (CRUD)
            const handleBankEdit = (index, field, value) => {
                const newData = { ...bankData };
                newData.appraisalBanks[index][field] = value;
                setBankData(newData);
            };

            const handleAddBank = () => {
                const newData = { ...bankData };
                newData.appraisalBanks.push({ name: '新銀行', rate: '(首購：...)' });
                setBankData(newData);
                setTimeout(() => {
                    const container = document.getElementById('edit-bank-container');
                    if(container) container.scrollTop = container.scrollHeight;
                }, 100);
            };

            const handleRemoveBank = (index) => {
                if(window.confirm('確定要刪除這家銀行嗎？')) {
                    const newData = { ...bankData };
                    const bankName = newData.appraisalBanks[index].name;
                    setAppraisalForm(prev => ({
                        ...prev, 
                        selectedBanks: prev.selectedBanks.filter(b => b !== bankName)
                    }));
                    newData.appraisalBanks.splice(index, 1);
                    setBankData(newData);
                }
            };

            const saveEditedRates = () => {
                setIsEditingRates(false);
                localStorage.setItem('mortgageBankData_PRO', JSON.stringify(bankData));
            };

            // 複製與分享
            const copyAppraisalReply = () => {
                navigator.clipboard.writeText(previewText);
                alert('估價回覆已複製！您可以直接至 LINE 群組貼上。');
            };

            const handleLineShare = () => {
                const lineDeepLink = `https://line.me/R/msg/text/?${encodeURIComponent(previewText)}`;
                window.open(lineDeepLink, '_blank');
            };

            // --- 原有 KYC 評估輸入處理 & 連動計算 ---
            const handleInputChange = (e) => {
                const { name, value, type, checked } = e.target;
                if (name === 'price') {
                    const priceVal = parseFloat(value) || 0;
                    setFormData(prev => ({ ...prev, price: value, loanAmount: Math.round(priceVal * 0.8) }));
                } else if (name === 'monthlyIncome') {
                    const monthlyVal = parseFloat(value) || 0;
                    setFormData(prev => ({ ...prev, monthlyIncome: value, annualIncome: Math.round(monthlyVal * 12) }));
                } else {
                    setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
                }
            };

            const toggleDebt = (debtType) => {
                setFormData(prev => {
                    const exists = prev.debts.includes(debtType);
                    if (exists) return { ...prev, debts: prev.debts.filter(d => d !== debtType) };
                    else return { ...prev, debts: [...prev.debts, debtType] };
                });
            };

            const handleParseText = () => {
                if(!importText.trim()) return;

                let newForm = { ...formData };
                newForm.debts = []; 
                const text = importText;

                const extractValue = (regex) => {
                    const match = text.match(regex);
                    return match ? match[1].trim() : null;
                };

                const jobStr = extractValue(/(?:職業|Q1)[：:\s]*([^\n]+)/) || text;
                if (jobStr.includes('受薪') || jobStr.includes('上班')) newForm.job = '一般上班族';
                else if (jobStr.includes('自營') || jobStr.includes('老闆') || jobStr.includes('負責')) newForm.job = '公司負責人';
                else if (jobStr.includes('自由') || jobStr.includes('SOHO')) newForm.job = '自由業';

                const assetStr = extractValue(/(?:房產|資產|Q3)[：:\s]*([^\n]+)/) || text;
                if (assetStr.includes('首購') || assetStr.includes('無')) newForm.assets = '無房屋';

                const ageRaw = extractValue(/(?:年齡|Q4)[：:\s]*(\d+)/);
                if (ageRaw) newForm.age = ageRaw;

                const incomeRaw = extractValue(/(?:月收|月收入|Q5)[：:\s]*([\d,]+)/);
                if (incomeRaw) {
                    let inc = parseFloat(incomeRaw.replace(/,/g, ''));
                    if (inc >= 1000) inc = inc / 10000;
                    newForm.monthlyIncome = inc;
                    newForm.annualIncome = inc * 12;
                }

                const loanRaw = extractValue(/(?:想貸金額|貸款金額|欲貸金額)[：:\s]*([\d,]+)/);
                if (loanRaw) {
                    let l = parseFloat(loanRaw.replace(/,/g, ''));
                    if (l > 10000) l = l / 10000;
                    newForm.loanAmount = l;
                }

                const priceRaw = extractValue(/(?:預計成交|開價|價格)[：:\s]*([\d,]+)/);
                if(priceRaw) {
                    let p = parseFloat(priceRaw.replace(/,/g, ''));
                    if (p > 10000) p = p / 10000;
                    newForm.price = p;
                    if (!loanRaw) newForm.loanAmount = Math.round(p * 0.8);
                }

                const debtRaw = extractValue(/(?:月負債|負債|Q6)[：:\s]*([\d,]+)/);
                if (debtRaw) {
                    newForm.debts = ['信貸'];
                    let d = parseFloat(debtRaw.replace(/,/g, ''));
                    if (d > 1000) d = d / 10000; 
                    newForm.debtAmount = Math.round(d * 80); 
                }

                setFormData(newForm);
                alert('智慧解析 2.0 執行成功！已自動校正單位並套用特徵識別。');
            };

            const calculateMonthlyPayment = () => {
                if (!formData.loanAmount || formData.loanAmount <= 0) return 0;
                const principal = formData.loanAmount * 10000; 
                const annualRate = 0.022;
                const monthlyRate = annualRate / 12;
                const months = 360;
                const pmt = principal * monthlyRate * Math.pow(1 + monthlyRate, months) / (Math.pow(1 + monthlyRate, months) - 1);
                return (pmt / 10000).toFixed(2);
            };

            const recommendations = useMemo(() => {
                let recs = [];
                const { job, assets, propertyType, needsRenovation, purpose, needsNoTieIn } = formData;

                if (assets === '無房屋') {
                    recs.push({
                        type: '首購優勢銀行 (標準專案)',
                        banks: bankData.firstTime,
                        reason: '經系統判定，客戶具備首購身分，適用各大銀行或新青安之低利優惠專案。'
                    });
                }

                if (job === '自由業' || job === '自營商' || job === '老闆' || job === '公司負責人') {
                    recs.push({
                        type: '自營商優勢',
                        banks: bankData.selfEmployed,
                        reason: '針對自營商/自由業，不同銀行有不同的收入認定標準。'
                    });
                }

                if (propertyType === '店面') {
                    recs.push({
                        type: '店面高成數',
                        banks: bankData.storefront.filter(b => b.ltv && (b.ltv.includes('8') || b.ltv.includes('9') || b.name === '王道' || b.name === '台中商銀')),
                        reason: '店面產品貸款成數通常較低，以下銀行提供較高成數或專案。'
                    });
                }

                if (needsRenovation) {
                    recs.push({
                        type: '裝潢貸款',
                        banks: bankData.renovation,
                        reason: '可搭配房貸申請裝潢金，需注意年限與利率差異。'
                    });
                }

                if (purpose === '轉增貸' || purpose === '現金買回貸') {
                    recs.push({
                        type: '現金購買再增貸 / 二胎',
                        banks: bankData.cashRefinance.concat(bankData.combo.filter(b => b.name === '王道' || b.name === '台中商銀')), 
                        reason: '注意「等待期」限制，部分銀行需持有滿一年或三個月。'
                    });
                }

                if (needsNoTieIn) {
                    recs.push({
                        type: '不綁約方案',
                        banks: bankData.noTieIn,
                        reason: '適合短期持有或打算快速清償者，但利率通常較高。'
                    });
                }

                return recs;
            }, [formData, bankData]);

            // UI Components
            const NavButton = ({ tab, icon: Icon, label }) => (
                <button 
                    onClick={() => { setActiveTab(tab); setIsMobileMenuOpen(false); }}
                    className={`flex items-center gap-3 px-4 py-3 rounded-lg transition-colors w-full text-left ${activeTab === tab ? 'bg-yellow-500 text-slate-900 font-bold' : 'hover:bg-slate-700 text-gray-300'}`}
                >
                    <Icon size={20} />
                    {label}
                </button>
            );

            return (
                <>
                    {/* Sidebar / Mobile Menu */}
                    <aside className={`bg-slate-800 text-white flex-shrink-0 z-50 transition-all duration-300
                        ${isMobileMenuOpen ? 'fixed inset-0 overflow-y-auto' : 'hidden md:block md:w-64 md:relative'}
                    `}>
                        <div className="p-6 border-b border-slate-700 flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-bold flex items-center gap-2">
                                    <Building2 className="w-6 h-6 text-yellow-400" />
                                    <div className="flex flex-col">
                                        <span className="text-base leading-tight">宏國地政、易丞地政</span>
                                        <span className="text-xs text-yellow-400 font-normal">房貸智囊團 Pro</span>
                                    </div>
                                </h1>
                            </div>
                            <button onClick={() => setIsMobileMenuOpen(false)} className="md:hidden">
                                <X size={24} />
                            </button>
                        </div>
                        <nav className="p-4 space-y-2">
                            <NavButton tab="appraisal" icon={MessageSquare} label="估價回覆產生器" />
                            <NavButton tab="assessment" icon={Calculator} label="客戶 KYC 評估" />
                            <NavButton tab="knowledge" icon={BookOpen} label="銀行方案大全" />
                            <NavButton tab="settings" icon={Settings} label="資料庫管理" />
                        </nav>
                        <div className="p-6 mt-auto hidden md:block">
                            <div className="bg-slate-700 rounded p-3 text-xs text-slate-300">
                                <p>系統版本：v5.2 (Nexus)</p>
                                <p>UI 渲染區塊：已全面修復</p>
                                <p>銀行增刪 CRUD：已啟動</p>
                            </div>
                        </div>
                    </aside>

                    {/* Mobile Header (When sidebar hidden) */}
                    <div className="md:hidden bg-slate-800 text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-40">
                         <h1 className="font-bold flex items-center gap-2">
                            <Building2 className="w-5 h-5 text-yellow-400" />
                            房貸智囊團 Pro
                        </h1>
                        <button onClick={() => setIsMobileMenuOpen(true)}>
                            <Menu size={24} />
                        </button>
                    </div>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-50 mobile-nav-fix">
                        
                        {/* 🌟 Tab: Appraisal Generator (估價回覆產生器) */}
                        {activeTab === 'appraisal' && (
                            <div className="max-w-5xl mx-auto space-y-6">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b pb-4">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                            <MessageSquare className="text-blue-600"/> 群組估價回覆產生器
                                        </h2>
                                        <p className="text-sm text-gray-500 mt-1">貼上業務進件訊息，勾選銀行即可一鍵生成公版回覆。</p>
                                    </div>
                                    <div className="flex gap-2 w-full md:w-auto">
                                        <button onClick={copyAppraisalReply} className="flex-1 bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded-lg flex justify-center items-center gap-2 text-sm shadow-md font-bold transition">
                                            <CheckCircle size={18} /> 複製文字
                                        </button>
                                        <button onClick={handleLineShare} className="flex-1 bg-[#06C755] hover:bg-[#05b34c] text-white px-5 py-2 rounded-lg flex justify-center items-center gap-2 text-sm shadow-md font-bold transition">
                                            <Send size={18} /> 一鍵傳送至 LINE
                                        </button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    {/* 左側：資料解析與編輯 */}
                                    <div className="space-y-4">
                                        <div className="bg-blue-50 p-4 rounded-xl border border-blue-200 shadow-sm">
                                            <h3 className="text-sm font-bold text-blue-800 mb-2 flex items-center gap-2">
                                                <ArrowDownCircle size={16}/> 1. 貼上群組進件訊息
                                            </h3>
                                            <textarea 
                                                className="w-full p-3 text-sm border border-blue-200 rounded-lg h-32 focus:ring-2 focus:ring-blue-400 mb-2"
                                                placeholder="請將群組收到的需求完整內容貼上..."
                                                value={appraisalRawText}
                                                onChange={(e) => setAppraisalRawText(e.target.value)}
                                            />
                                            <button 
                                                onClick={handleParseAppraisalText}
                                                className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded text-sm font-bold shadow transition"
                                            >
                                                智能解析內容
                                            </button>
                                        </div>

                                        <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                            <h3 className="text-md font-bold mb-4 border-b pb-2 text-slate-700">2. 確認案件資訊</h3>
                                            <div className="grid grid-cols-2 gap-4 mb-4">
                                                <div>
                                                    <label className="block text-xs text-gray-500 mb-1">日期代碼</label>
                                                    <input type="text" value={appraisalForm.dateId} onChange={(e)=>setAppraisalForm({...appraisalForm, dateId: e.target.value})} className="w-full p-2 border rounded text-sm bg-gray-50 focus:ring-blue-500" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-gray-500 mb-1">專案名稱</label>
                                                    <input type="text" value={appraisalForm.projectName} onChange={(e)=>setAppraisalForm({...appraisalForm, projectName: e.target.value})} className="w-full p-2 border rounded text-sm bg-gray-50 focus:ring-blue-500" />
                                                </div>
                                            </div>
                                            <div className="space-y-3">
                                                <div>
                                                    <label className="block text-xs text-gray-500 mb-1">客戶姓名</label>
                                                    <input type="text" value={appraisalForm.clientName} onChange={(e)=>setAppraisalForm({...appraisalForm, clientName: e.target.value})} className="w-full p-2 border rounded text-sm bg-yellow-50 focus:ring-blue-500" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-gray-500 mb-1">📍標的位置</label>
                                                    <input type="text" value={appraisalForm.address} onChange={(e)=>setAppraisalForm({...appraisalForm, address: e.target.value})} className="w-full p-2 border rounded text-sm bg-yellow-50 focus:ring-blue-500" />
                                                </div>
                                                <div>
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <select 
                                                            value={appraisalForm.priceType} 
                                                            onChange={(e) => setAppraisalForm({...appraisalForm, priceType: e.target.value})}
                                                            className="text-xs text-blue-700 border-b border-blue-300 font-bold bg-transparent outline-none cursor-pointer focus:ring-0 pb-0.5"
                                                        >
                                                            <option value="開價">💰 開價</option>
                                                            <option value="成交價">💰 成交價</option>
                                                        </select>
                                                    </div>
                                                    <input type="text" value={appraisalForm.price} onChange={(e)=>setAppraisalForm({...appraisalForm, price: e.target.value})} className="w-full p-2 border rounded text-sm bg-yellow-50 focus:ring-blue-500" />
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 右側：銀行挑選與預覽 */}
                                    <div className="space-y-4">
                                        <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                            <div className="flex justify-between items-center mb-4 border-b pb-2">
                                                <h3 className="text-md font-bold text-slate-700">3. 選擇送估銀行</h3>
                                                {isEditingRates ? (
                                                    <button onClick={saveEditedRates} className="text-xs bg-green-500 text-white px-3 py-1.5 rounded hover:bg-green-600 shadow-sm font-bold flex items-center gap-1 transition">
                                                        <CheckCircle size={14}/> 完成儲存
                                                    </button>
                                                ) : (
                                                    <button onClick={() => setIsEditingRates(true)} className="text-xs text-blue-600 hover:text-blue-800 flex items-center gap-1 font-bold bg-blue-50 px-2 py-1.5 rounded transition">
                                                        <Edit2 size={14}/> 快速編輯/新增銀行
                                                    </button>
                                                )}
                                            </div>
                                            
                                            {isEditingRates ? (
                                                <div id="edit-bank-container" className="space-y-2 max-h-72 overflow-y-auto pr-2 custom-scrollbar">
                                                    {bankData.appraisalBanks.map((bank, idx) => (
                                                        <div key={idx} className="flex items-center gap-2 text-sm bg-white p-2 rounded border border-gray-200 shadow-sm hover:border-blue-300 transition-colors">
                                                            <input 
                                                                type="text" 
                                                                value={bank.name} 
                                                                onChange={(e) => handleBankEdit(idx, 'name', e.target.value)}
                                                                className="w-24 font-bold text-blue-800 p-1.5 border rounded focus:ring-2 focus:ring-blue-500 bg-blue-50/50"
                                                                placeholder="銀行名稱"
                                                            />
                                                            <input 
                                                                type="text" 
                                                                value={bank.rate} 
                                                                onChange={(e) => handleBankEdit(idx, 'rate', e.target.value)}
                                                                className="flex-1 p-1.5 border rounded focus:ring-2 focus:ring-blue-500 text-xs text-gray-600"
                                                                placeholder="（輸入完整利率文字含括號）"
                                                            />
                                                            <button onClick={() => handleRemoveBank(idx)} className="text-red-400 hover:text-red-600 p-1 bg-red-50 rounded" title="刪除此銀行">
                                                                <X size={16} />
                                                            </button>
                                                        </div>
                                                    ))}
                                                    <button onClick={handleAddBank} className="w-full mt-3 py-2 border-2 border-dashed border-blue-300 text-blue-600 rounded-lg hover:bg-blue-50 hover:border-blue-400 font-bold text-sm flex justify-center items-center gap-2 transition">
                                                        <PlusCircle size={16} /> 新增銀行
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                                                    {bankData.appraisalBanks.map((bank, idx) => {
                                                        const isSelected = appraisalForm.selectedBanks.includes(bank.name);
                                                        return (
                                                            <div 
                                                                key={idx} 
                                                                onClick={() => toggleAppraisalBank(bank.name)}
                                                                className={`cursor-pointer border rounded p-2 text-center text-sm transition-all select-none flex flex-col justify-center
                                                                    ${isSelected ? 'bg-blue-600 text-white border-blue-600 font-bold shadow-md transform scale-105' : 'bg-gray-50 text-gray-600 hover:bg-gray-100'}
                                                                `}
                                                            >
                                                                {bank.name}
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            )}
                                        </div>

                                        <div className="bg-slate-800 rounded-xl shadow-sm p-5 relative group">
                                            <div className="flex justify-between items-center mb-3">
                                                <h3 className="text-sm font-bold text-slate-300 flex items-center gap-2">
                                                    <Edit2 size={16}/> 即時預覽與編輯 (可直接打字修改)
                                                </h3>
                                                <span className="text-xs text-slate-500">修改左側選項會重新覆蓋此處</span>
                                            </div>
                                            <textarea 
                                                className="w-full h-64 bg-slate-900 text-green-400 p-4 rounded font-mono text-sm border border-slate-700 focus:border-green-500 focus:ring-1 focus:ring-green-500 resize-none leading-relaxed custom-scrollbar shadow-inner transition-colors"
                                                value={previewText}
                                                onChange={(e) => setPreviewText(e.target.value)}
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Tab: Assessment (客戶 KYC 評估) */}
                        {activeTab === 'assessment' && (
                            <div className="max-w-6xl mx-auto space-y-6">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b pb-4">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-800">客戶 KYC 評估</h2>
                                        <p className="text-sm text-gray-500 mt-1">智慧關鍵字分析引擎 2.0 (已支援 v5.2 格式與模糊解析)</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="lg:col-span-1 space-y-4">
                                        <div className="bg-blue-50 p-4 rounded-xl border border-blue-200 shadow-sm">
                                            <h3 className="text-sm font-bold text-blue-800 mb-2 flex items-center gap-2">
                                                <FileText size={16}/> 智慧匯入 (關鍵字解析)
                                            </h3>
                                            <textarea 
                                                className="w-full p-2 text-xs border border-blue-200 rounded h-32 focus:ring-2 focus:ring-blue-400 mb-2"
                                                placeholder="將任意格式的客戶資料貼上，Nexus 會運用關鍵字為您抓取..."
                                                value={importText}
                                                onChange={(e) => setImportText(e.target.value)}
                                            />
                                            <button 
                                                onClick={handleParseText}
                                                className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded text-sm font-bold flex justify-center items-center gap-2 shadow"
                                            >
                                                <ArrowDownCircle size={16} /> 執行解析並填入表單
                                            </button>
                                        </div>

                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                                            <h3 className="text-lg font-bold mb-4 border-b pb-2 flex items-center gap-2">
                                                <Users size={18} /> 客戶基本資料
                                            </h3>
                                            <div className="space-y-4 text-sm">
                                                <div>
                                                    <label className="block text-gray-600 mb-1 font-bold">職業類別</label>
                                                    <select name="job" value={formData.job} onChange={handleInputChange} className="w-full p-2 border rounded bg-gray-50 focus:ring-blue-500">
                                                        <option value="一般上班族">一般上班族</option>
                                                        <option value="自由業">自由業/自營商</option>
                                                        <option value="公司負責人">公司負責人</option>
                                                        <option value="家管">家管</option>
                                                    </select>
                                                </div>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <div>
                                                        <label className="block text-gray-600 mb-1 font-bold">成交價 (萬)</label>
                                                        <input type="number" name="price" value={formData.price} onChange={handleInputChange} className="w-full p-2 border rounded focus:ring-blue-500" />
                                                    </div>
                                                    <div>
                                                        <label className="block text-gray-600 mb-1 font-bold">欲貸金額 (萬)</label>
                                                        <input type="number" name="loanAmount" value={formData.loanAmount} onChange={handleInputChange} className="w-full p-2 border rounded focus:ring-blue-500 bg-yellow-50" />
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <div>
                                                         <label className="block text-gray-600 mb-1 font-bold">月收 (萬)</label>
                                                         <input type="number" name="monthlyIncome" value={formData.monthlyIncome} onChange={handleInputChange} className="w-full p-2 border rounded focus:ring-blue-500 bg-yellow-50" />
                                                    </div>
                                                    <div>
                                                         <label className="block text-gray-600 mb-1 font-bold">年齡</label>
                                                         <input type="number" name="age" value={formData.age} onChange={handleInputChange} className="w-full p-2 border rounded focus:ring-blue-500" />
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="block text-gray-600 mb-1 font-bold">資產狀況</label>
                                                    <select name="assets" value={formData.assets} onChange={handleInputChange} className="w-full p-2 border rounded bg-yellow-50 focus:ring-blue-500">
                                                        {ASSET_OPTIONS.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-gray-600 mb-1 font-bold">負債項目</label>
                                                    <div className="flex flex-wrap gap-2">
                                                        {DEBT_OPTIONS.map(opt => (
                                                            <button
                                                                key={opt}
                                                                onClick={() => toggleDebt(opt)}
                                                                className={`px-2 py-1 rounded text-xs border transition-colors ${
                                                                    formData.debts.includes(opt) 
                                                                    ? 'bg-red-100 border-red-300 text-red-700 font-bold' 
                                                                    : 'bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100'
                                                                }`}
                                                            >
                                                                {opt}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="block text-gray-600 mb-1 font-bold">負債總額估算 (萬)</label>
                                                    <input type="number" name="debtAmount" value={formData.debtAmount} onChange={handleInputChange} className="w-full p-2 border rounded bg-yellow-50 focus:ring-blue-500" />
                                                </div>
                                                
                                                {/* 這裡就是被誤刪並已修復的 UI 區塊 */}
                                                <div className="border-t pt-4 mt-4">
                                                    <h4 className="font-bold mb-2">特殊需求與產品</h4>
                                                    <div className="space-y-3">
                                                        <div className="flex items-center justify-between">
                                                            <label>產品類型</label>
                                                            <select name="propertyType" value={formData.propertyType} onChange={handleInputChange} className="p-1 border rounded bg-gray-50 w-32">
                                                                <option value="住家">住家</option>
                                                                <option value="店面">店面/商用</option>
                                                                <option value="透天">透天</option>
                                                            </select>
                                                        </div>
                                                        <div className="flex items-center justify-between">
                                                            <label>資金用途</label>
                                                            <select name="purpose" value={formData.purpose} onChange={handleInputChange} className="p-1 border rounded bg-gray-50 w-32">
                                                                <option value="購屋">一般購屋</option>
                                                                <option value="轉增貸">轉增貸</option>
                                                                <option value="現金買回貸">現金買後貸款</option>
                                                            </select>
                                                        </div>
                                                        <label className="flex items-center gap-3 cursor-pointer bg-slate-50 p-2 rounded hover:bg-slate-100 transition">
                                                            <input type="checkbox" name="needsRenovation" checked={formData.needsRenovation} onChange={handleInputChange} className="w-4 h-4" />
                                                            <span className="text-sm font-bold text-gray-700">需要裝潢貸款</span>
                                                        </label>
                                                        <label className="flex items-center gap-3 cursor-pointer bg-slate-50 p-2 rounded hover:bg-slate-100 transition">
                                                            <input type="checkbox" name="needsNoTieIn" checked={formData.needsNoTieIn} onChange={handleInputChange} className="w-4 h-4" />
                                                            <span className="text-sm font-bold text-gray-700">希望不綁約</span>
                                                        </label>
                                                    </div>
                                                </div>

                                            </div>
                                        </div>
                                    </div>

                                    <div className="lg:col-span-2 space-y-6">
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                                            <h3 className="text-lg font-bold mb-4 flex items-center gap-2 text-blue-800">
                                                <TrendingUp size={20} /> 初步財務比率 (Pro)
                                            </h3>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                <div className="bg-blue-50 p-4 rounded-lg">
                                                    <p className="text-xs text-blue-600 font-bold uppercase">LTV 貸款成數</p>
                                                    <p className="text-2xl font-bold text-blue-900">
                                                        {formData.price > 0 ? ((formData.loanAmount / formData.price) * 100).toFixed(1) : 0}%
                                                    </p>
                                                </div>
                                                <div className="bg-green-50 p-4 rounded-lg">
                                                    <p className="text-xs text-green-600 font-bold uppercase">DBR 收支比估算</p>
                                                    <p className="text-2xl font-bold text-green-900">
                                                        {formData.monthlyIncome > 0 
                                                            ? Math.round(((calculateMonthlyPayment() * 10000 + (formData.debtAmount * 0.02 * 10000 || 0)) / (formData.monthlyIncome * 10000)) * 100)
                                                            : 0}%
                                                    </p>
                                                    <p className="text-xs text-green-500 mt-1">含房貸+負債</p>
                                                </div>
                                                <div className="bg-purple-50 p-4 rounded-lg">
                                                    <p className="text-xs text-purple-600 font-bold uppercase">本息攤還試算</p>
                                                    <p className="text-2xl font-bold text-purple-900">
                                                        {calculateMonthlyPayment()} <span className="text-sm">萬/月</span>
                                                    </p>
                                                </div>
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="text-lg font-bold mb-4 flex items-center gap-2">
                                                <CheckCircle size={20} className="text-green-600" /> 
                                                適合銀行推薦策略
                                            </h3>
                                            
                                            {recommendations.length === 0 ? (
                                                <div className="bg-white p-8 rounded-xl shadow-sm border border-gray-200 text-center text-gray-500">
                                                    <p className="text-lg mb-2">🧐 目前條件為一般標準案件</p>
                                                    <p className="text-sm">建議優先詢問薪轉銀行或主力往來銀行，或至「銀行方案大全」查看更多資訊。</p>
                                                </div>
                                            ) : (
                                                <div className="space-y-6">
                                                    {recommendations.map((rec, idx) => (
                                                        <div key={idx} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                                            <div className="bg-slate-50 p-3 border-b border-gray-100 flex justify-between items-center">
                                                                <span className="font-bold text-slate-700 flex items-center gap-2">
                                                                    <Unlock size={16} /> {rec.type}
                                                                </span>
                                                                <span className="text-xs text-slate-500">{rec.reason}</span>
                                                            </div>
                                                            <div className="p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                                                                {rec.banks.map((bank, bIdx) => (
                                                                    <div key={bIdx} className="bg-yellow-50/50 p-3 rounded border border-yellow-100 hover:bg-yellow-50 transition-colors">
                                                                        <div className="flex justify-between items-start mb-1">
                                                                            <span className="font-bold text-blue-800 text-base">{bank.name}</span>
                                                                            <div className="flex gap-1">
                                                                                {bank.highlight && <span className="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded-full">{bank.highlight}</span>}
                                                                                {bank.ltv && <span className="bg-green-100 text-green-800 text-xs px-2 py-0.5 rounded-full">{bank.ltv}</span>}
                                                                            </div>
                                                                        </div>
                                                                        <div className="text-sm text-gray-600 space-y-1 mt-2">
                                                                            {bank.rules && bank.rules.map((r, i) => <li key={i} className="list-none text-xs flex gap-1 before:content-['•']">{r}</li>)}
                                                                            {bank.terms && <p className="text-xs font-medium bg-white/50 p-1 rounded inline-block">條件：{bank.terms}</p>}
                                                                            {bank.notes && <p className="text-xs text-gray-500 mt-1">{bank.notes}</p>}
                                                                            {bank.rate && <p className="text-xs text-red-500 font-bold mt-1">利率：{bank.rate}</p>}
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 🌟 Tab: Knowledge (銀行方案大全 - 一字不漏完整還原版) */}
                        {activeTab === 'knowledge' && (
                            <div className="max-w-4xl mx-auto space-y-8">
                                <h2 className="text-2xl font-bold text-slate-800 border-b pb-4">銀行方案知識庫</h2>
                                
                                <section>
                                    <h3 className="text-xl font-bold text-blue-700 mb-4 flex items-center gap-2">
                                        <Briefcase /> 首購 / 一般受薪 專案
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {bankData.firstTime.map((bank, idx) => (
                                            <div key={idx} className="bg-white p-4 rounded-lg shadow-sm border border-gray-200 hover:shadow-md transition-shadow border-l-4 border-l-blue-500">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="font-bold text-lg">{bank.name}</span>
                                                    <span className="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">{bank.highlight}</span>
                                                </div>
                                                <ul className="list-disc pl-5 text-sm text-gray-600 space-y-1">
                                                    {bank.rules.map((rule, rIdx) => <li key={rIdx}>{rule}</li>)}
                                                </ul>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <section>
                                    <h3 className="text-xl font-bold text-blue-700 mb-4 flex items-center gap-2">
                                        <Briefcase /> 自營商/負責人 收入認定
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {bankData.selfEmployed.map((bank, idx) => (
                                            <div key={idx} className="bg-white p-4 rounded-lg shadow-sm border border-gray-200 hover:shadow-md transition-shadow">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="font-bold text-lg">{bank.name}</span>
                                                    <span className="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">{bank.highlight}</span>
                                                </div>
                                                <ul className="list-disc pl-5 text-sm text-gray-600 space-y-1">
                                                    {bank.rules.map((rule, rIdx) => <li key={rIdx}>{rule}</li>)}
                                                </ul>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <section>
                                    <h3 className="text-xl font-bold text-purple-700 mb-4 flex items-center gap-2">
                                        <Users /> 保證人收支計算邏輯
                                    </h3>
                                    <div className="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-purple-50 text-purple-900">
                                                <tr>
                                                    <th className="p-3">銀行</th>
                                                    <th className="p-3">收支比規範</th>
                                                    <th className="p-3 hidden md:table-cell">計算細節</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100">
                                                {bankData.guarantor.map((g, idx) => (
                                                    <tr key={idx}>
                                                        <td className="p-3 font-bold">{g.name}</td>
                                                        <td className="p-3">{g.rule}</td>
                                                        <td className="p-3 text-gray-600 block md:table-cell text-xs md:text-sm">{g.calc}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </section>

                                <section>
                                    <h3 className="text-xl font-bold text-green-700 mb-4 flex items-center gap-2">
                                        <Home /> 店面、二胎與裝潢
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <h4 className="font-bold mb-2 bg-slate-100 p-2 rounded">店面產品 (成數)</h4>
                                            <ul className="bg-white p-4 rounded-lg shadow-sm border border-gray-200 space-y-2 text-sm">
                                                {bankData.storefront.map((s, i) => (
                                                    <li key={i} className="flex justify-between border-b border-gray-50 last:border-0 pb-1">
                                                        <span className="font-bold">{s.name}</span>
                                                        <span>{s.ltv} <span className="text-gray-400 text-xs">({s.notes})</span></span>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                        <div>
                                             <h4 className="font-bold mb-2 bg-slate-100 p-2 rounded">二胎 / 轉增貸專案</h4>
                                             <ul className="bg-white p-4 rounded-lg shadow-sm border border-gray-200 space-y-2 text-sm">
                                                {bankData.combo.concat(bankData.cashRefinance.filter(x=>x.name==='王道')).map((s, i) => (
                                                    <li key={i} className="border-b border-gray-50 last:border-0 pb-2">
                                                        <div className="flex justify-between font-bold">
                                                            <span>{s.name}</span>
                                                            <span className="text-blue-600">{s.rate || s.terms}</span>
                                                        </div>
                                                        <div className="text-xs text-gray-500 mt-1">{s.notes || s.terms}</div>
                                                    </li>
                                                ))}
                                             </ul>
                                        </div>
                                    </div>
                                </section>
                            </div>
                        )}

                        {/* Tab: Settings */}
                        {activeTab === 'settings' && (
                            <div className="max-w-3xl mx-auto">
                                <h2 className="text-2xl font-bold text-slate-800 mb-6">資料庫管理</h2>
                                <div className="bg-yellow-50 p-4 rounded-lg border border-yellow-200 mb-6 text-sm text-yellow-800 flex items-start gap-2">
                                    <AlertCircle size={20} className="shrink-0" />
                                    <div>
                                        <p className="font-bold">注意：</p>
                                        <p>此處允許編輯系統底層邏輯原始碼 (JSON)。一般修改利率請至「估價回覆產生器」使用快速編輯即可。</p>
                                    </div>
                                </div>
                                
                                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
                                    <textarea 
                                        className="w-full h-96 font-mono text-sm p-4 border rounded bg-slate-50 focus:ring-2 focus:ring-blue-500 custom-scrollbar"
                                        value={JSON.stringify(bankData, null, 2)}
                                        onChange={(e) => {
                                            try {
                                                const newData = JSON.parse(e.target.value);
                                                setBankData(newData);
                                            } catch(err) {}
                                        }}
                                    />
                                </div>

                                <div className="flex gap-4 mt-6">
                                    <button onClick={handleSaveData} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold shadow">
                                        <Save size={20} /> 儲存變更
                                    </button>
                                    <button onClick={handleResetData} className="flex items-center gap-2 bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-3 rounded-lg font-bold">
                                        <RotateCcw size={20} /> 恢復原廠預設值
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
